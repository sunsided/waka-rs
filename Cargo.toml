[package]
name = "waka"
description = "Client for the WakaTime API"
authors = ["Markus Mayer"]
version = "0.2.1"
edition = "2024"
rust-version = "1.87"
readme = "README.md"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/waka-rs"
keywords = ["wakatime", "api-client", "statistics", "time-tracking"]
categories = ["api-bindings", "web-programming::http-client"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
base64 = "0.22"
percent-encoding = "2"
query-string-builder = "0.7"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
assert2 = "0.4"
dotenvy = "0.15.7"
tokio = { version = "1.52.3", features = ["full"] }
wiremock = "0.6"
