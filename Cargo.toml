[workspace]
resolver = "3"
members = ["waka", "waka-cli"]

[workspace.package]
authors = ["Markus Mayer"]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/waka-rs"

[workspace.dependencies]
# Workspace crates
waka = { version = "0.3.0", path = "waka" }

# Dependencies
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
dirs = "6"
dotenvy = "0.15.7"
getrandom = "0.3"
keyring = "4.2"
percent-encoding = "2"
query-string-builder = "0.7"
reqwest = { version = "0.13", features = ["form", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = "1.52.3"
url = "2.5"
webbrowser = "1.2"

# Dev dependencies
assert2 = "0.4"
tempfile = "3.27"
wiremock = "0.6"
